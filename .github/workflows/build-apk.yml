name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/RidiculousWars-v1.0.${{ github.run_number }}.apk"
          ls -la dist

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RidiculousWars-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ridiculous Wars v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            **Download the `.apk` below and open it on your Android phone to install.**

            - Android 8.0 or newer.
            - You may need to allow "Install unknown apps" for your browser or file manager.
            - Every build is signed with the same key, so new versions install over old ones and keep your progress.

            Free forever: no ads, no in-app purchases, no timers. Dental not included.
